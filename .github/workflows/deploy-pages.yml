name: Deploy WebApp to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'WebApp/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebApp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Classic mode runs the original 1997 VTTSP.EXE, which must never be
      # published. Fail if anything of it reached the build.
      - name: Check no original program files are deployed
        run: |
          found=$(find dist \( -iname '*.exe' -o -iname '*.jsdos' -o -iname 'classic*' \) -print)
          if [ -n "$found" ] || grep -rIl -e 'DOS4GW' -e 'js-dos' dist; then
            echo "::error::Original program files found in dist: $found"
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: WebApp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
